version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdf_analyzer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdfanalyzer
      POSTGRES_PASSWORD: pdfanalyzer_pass
      POSTGRES_DB: pdf_analyzer_db
    ports:
      - "5433:5432"
    volumes:
      - pdf_analyzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfanalyzer -d pdf_analyzer_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: pdf_analyzer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pdf_analyzer_pgdata:
  redis_data: